name: PhishGuard CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Backend Tests & Lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Upgrade pip and install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install ruff

      - name: Run Ruff Lint Check
        run: |
          ruff check .
      - name: Download and verify UCI dataset
        shell: bash
        run: |
          mkdir -p data/raw

          curl -L --fail --retry 3 \
            -o /tmp/phiusiil.zip \
            "https://archive.ics.uci.edu/static/public/967/phiusiil+phishing+url+dataset.zip"

          unzip -q /tmp/phiusiil.zip -d /tmp/phiusiil

          CSV_PATH=$(find /tmp/phiusiil -type f \
            -name "PhiUSIIL_Phishing_URL_Dataset.csv" \
            -print -quit)

          test -n "$CSV_PATH"

          cp "$CSV_PATH" data/raw/PhiUSIIL_Phishing_URL_Dataset.csv

          echo "a236549cd369cd80bd478ff8e1779cbf44c58d5c3f79f7a51a1adbed7d06d1c6  data/raw/PhiUSIIL_Phishing_URL_Dataset.csv" \
            | sha256sum -c -
      - name: Run Pytest Test Suite
        run: |
          python -m pytest

  docker-build:
    name: Verify Docker Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: phishguard:ci-test
