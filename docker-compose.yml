version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: phishguard-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - MODEL_DEFAULT=ann
      - MODEL_ARTIFACT_DIR=/app/artifacts/models
      - PREPROCESSOR_ARTIFACT_DIR=/app/artifacts/preprocessors
      - ALLOWED_ORIGINS=http://localhost:5173,http://localhost:3000
      - LOG_LEVEL=INFO
    volumes:
      - ./artifacts:/app/artifacts:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - phishguard-network

  # Frontend service structure prepared for Phase 14 (React + Vite)
  # Uncomment when frontend containerization is activated in Phase 16
  # frontend:
  #   build:
  #     context: ./frontend
  #     dockerfile: Dockerfile
  #   container_name: phishguard-frontend
  #   restart: unless-stopped
  #   ports:
  #     - "5173:5173"
  #   environment:
  #     - VITE_API_URL=http://localhost:8000
  #   depends_on:
  #     backend:
  #       condition: service_healthy
  #   networks:
  #     - phishguard-network

networks:
  phishguard-network:
    driver: bridge
